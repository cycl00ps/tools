services:
  openbao:
    image: openbao/openbao:2.6.0
    container_name: openbao
    restart: unless-stopped
    # Official entrypoint injects -dev-listen-address which double-binds :8200
    # when a listener is already defined in config.hcl.
    entrypoint: ["bao"]
    command: ["server", "-config=/openbao/config"]
    ports:
      - "127.0.0.1:9092:8200"
    volumes:
      - ${OPENBAO_APPDATA:-/fast/docker-appdata/openbao}/config:/openbao/config:ro
      - ${OPENBAO_APPDATA:-/fast/docker-appdata/openbao}/data:/openbao/data
    networks:
      - openbao

networks:
  openbao:
    name: openbao
    driver: bridge
